name: CI

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:images
        env:
          IMAGES_STRICT: '1' # every photo in the manifest must be used
      - run: npm run check:a11y
      - run: npm run check:sandbox

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [server, static]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: npm
      - run: npm ci

      # server: the full app (Next image optimizer, /api proxied to the backend).
      - name: Build server
        if: matrix.target == 'server'
        run: npm run build -w frontend

      # static: plain HTML in out/, no server and no /api.
      - name: Build static
        if: matrix.target == 'static'
        env:
          NEXT_OUTPUT: export
        run: |
          npm run images -w frontend
          npm run build -w frontend
          npm run check:static -w frontend

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: npm
      - run: npm ci
      # shared, backend and frontend: scanner, moderation, age gate, scoring, streaks, CSP, billing, API client ...
      - run: npm test

  e2e:
    name: End-to-end smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: npm
      - run: npm ci
      # Starts the real backend and a mock model, then drives the HTTP API: hostile reply, create, play on the
      # isolated game origin, publish, like, daily challenge and reports. No keys or network needed.
      - run: npm run test:e2e

  ci-passed:
    name: CI passed
    needs: [lint, build, unit, e2e]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Post or update the summary comment
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true # Dependabot and fork tokens are read-only
        uses: actions/github-script@v9
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const marker = '<!-- ci-summary -->';
            const icon = (r) => (r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌');
            const needs = JSON.parse(process.env.NEEDS);
            const names = { lint: 'Lint and type check', build: 'Build (server and static)', unit: 'Unit tests', e2e: 'End-to-end smoke' };
            const ok = Object.values(needs).every((n) => n.result === 'success');
            const body = [
              marker,
              `### CI ${ok ? 'passed ✅' : 'failed ❌'}`,
              '',
              '| Job | Result |',
              '| --- | --- |',
              ...Object.entries(needs).map(([id, n]) => `| ${names[id] ?? id} | ${icon(n.result)} ${n.result} |`),
              '',
              `Commit \`${context.payload.pull_request.head.sha.slice(0, 7)}\` · [run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const mine = comments.find((c) => c.body && c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      # The one status check the branch rules require. Fails unless every job in `needs` succeeded.
      - name: Require all jobs to pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "::error::CI did not pass"
          exit 1
