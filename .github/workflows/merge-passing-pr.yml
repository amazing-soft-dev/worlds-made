name: Merge passing pull request

# Starts only after CI finishes. The merge is a merge commit, and only for a pull request
# whose head is still the commit CI validated.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  merge:
    name: Merge the validated pull request
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Needs the repository secret so the merge into dev pushes dev and starts the next workflows.
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GH_REPO: ${{ github.repository }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check the GH_TOKEN secret
        id: token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning title=GH_TOKEN missing::CI passed but the pull request cannot be merged automatically without the GH_TOKEN repository secret."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the scripts
        if: steps.token.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts

      - name: Merge
        if: steps.token.outputs.ready == 'true'
        run: bash .github/scripts/merge-pr.sh
